<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>cali · calistenia diaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <header class="app-cabecera">
    <h1>cali</h1>
    <p>tu sesión de calistenia, apta para tu hombro</p>
  </header>

  <main id="vista" class="vista"></main>

  <div id="sesion-barra" class="sesion-barra" hidden>
    <div class="sesion-barra-info">
      <strong id="barra-nombre">—</strong>
      <span id="cuenta" class="cuenta">0:00</span>
    </div>
    <div class="sesion-barra-botones">
      <button id="btn-play" data-accion-barra="play" class="btn-barra principal">▶</button>
      <button data-accion-barra="siguiente" class="btn-barra" aria-label="Siguiente ejercicio">⏭</button>
    </div>
  </div>

  <nav class="tabbar">
    <button data-tab="sesion" class="activa">🔥<span>Sesión</span></button>
    <button data-tab="ejercicios">📚<span>Ejercicios</span></button>
    <button data-tab="ajustes">⚙️<span>Ajustes</span></button>
  </nav>

  <script src="js/exercises.js?v=4"></script>
  <script src="js/storage.js?v=4"></script>
  <script src="js/session.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
